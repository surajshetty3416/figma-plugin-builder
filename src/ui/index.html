<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>/* STYLES */</style>
</head>
<body data-selection="empty">

<main class="panel">
  <section class="selection" aria-live="polite">
    <svg class="icon icon-pointer" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12.034 12.681a.498.498 0 0 1 .647-.647l9 3.5a.5.5 0 0 1-.033.943l-3.444 1.068a1 1 0 0 0-.66.66l-1.067 3.443a.5.5 0 0 1-.943.033z" />
      <path d="M5 3a2 2 0 0 0-2 2" /><path d="M19 3a2 2 0 0 1 2 2" /><path d="M5 21a2 2 0 0 1-2-2" />
      <path d="M9 3h1" /><path d="M9 21h2" /><path d="M14 3h1" /><path d="M3 9v1" /><path d="M21 9v2" /><path d="M3 14v1" />
    </svg>
    <svg class="icon icon-frame" viewBox="0 0 24 24" aria-hidden="true">
      <line x1="22" x2="2" y1="6" y2="6" /><line x1="22" x2="2" y1="18" y2="18" />
      <line x1="6" x2="6" y1="2" y2="22" /><line x1="18" x2="18" y1="2" y2="22" />
    </svg>
    <div class="selection-text">
      <p class="selection-name" id="selection-name">Nothing selected</p>
      <p class="selection-detail" id="selection-detail">Select a frame to copy</p>
    </div>
  </section>

  <button class="button" id="copy-button" type="button" data-state="idle" disabled>
    <span class="button-face face-idle">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </svg>
      <span>Copy to Clipboard</span>
    </span>
    <span class="button-face face-copying">
      <svg class="icon icon-loader" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      <span>Copying…</span>
    </span>
    <span class="button-face face-copied">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 6 9 17l-5-5" />
      </svg>
      <span id="paste-hint">Paste using ⌘V</span>
    </span>
    <span class="button-face face-failed">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" x2="12" y1="8" y2="12" />
        <line x1="12" x2="12.01" y1="16" y2="16" />
      </svg>
      <span>Try again</span>
    </span>
  </button>
  <p class="sr-only" id="status" role="status"></p>

  <section class="options" aria-labelledby="options-heading">
    <h2 class="options-heading" id="options-heading">Options</h2>

    <label class="option">
      <span class="option-text">
        <span class="option-name" id="opt-preserve-vars-name">Keep variables</span>
        <span class="option-detail" id="opt-preserve-vars-detail">Write them as var(--name)</span>
      </span>
      <input class="switch" type="checkbox" role="switch" id="opt-preserve-vars" checked
        aria-labelledby="opt-preserve-vars-name" aria-describedby="opt-preserve-vars-detail" />
    </label>

    <label class="option">
      <span class="option-text">
        <span class="option-name" id="opt-semantic-name">Heading tags</span>
        <span class="option-detail" id="opt-semantic-detail">Pick h1–h6 by name or size</span>
      </span>
      <input class="switch" type="checkbox" role="switch" id="opt-semantic" checked
        aria-labelledby="opt-semantic-name" aria-describedby="opt-semantic-detail" />
    </label>

    <label class="option">
      <span class="option-text">
        <span class="option-name" id="opt-inline-images-name">Embed images</span>
        <span class="option-detail" id="opt-inline-images-detail">Off leaves images empty</span>
      </span>
      <input class="switch" type="checkbox" role="switch" id="opt-inline-images" checked
        aria-labelledby="opt-inline-images-name" aria-describedby="opt-inline-images-detail" />
    </label>
  </section>
</main>

<script>/* SCRIPT */</script>
</body>
</html>
