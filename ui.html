
<div id="no-frame" style="padding: 10px; font-family: Arial, Helvetica, sans-serif; text-align: center;">
  <h2 style="margin-bottom: 5px;">No frame selected</h2>
  <p style="margin-top: 5px; color: rgb(100, 100, 100);">Please select a frame to copy</p>
</div>

<div id="copy" style="display: none; place-items: center; height: 100%; background: #10101022; color: rgb(100, 100, 100);">
  <div style="width: 100%; text-align: center;">
    <button id="copy-button" style="border: none; background: #000; color:white; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: auto;">Copy Frame</button>
    <p style="margin-top: 10px; font-size: 12px; font-family: Arial, Helvetica, sans-serif;" id="current-selection"></p>
  </div>
</div>

<script>
  let dataToCopy = null;
  document.getElementById("copy-button").addEventListener("click", () => {
    parent.postMessage({ pluginMessage: { type: "copy-data" } }, "*");
  });

  // Listen for messages from the plugin
  onmessage = async (event) => {
    const { type, message } = event.data.pluginMessage;
    if (type === "no-selection") {
      document.getElementById("no-frame").style.display = "block";
      document.getElementById("copy").style.display = "none";
    } else if (type === "selection") {
      document.getElementById("no-frame").style.display = "none";
      document.getElementById("copy").style.display = "grid";
      document.getElementById("current-selection").innerText = `${message}`;
    } else if (type === "copy-to-clipboard") {
      dataToCopy = message;
      document.execCommand("copy");
    }
  };

  const copyToClipboard = (event) => {
    event.clipboardData.setData(
      "builder-copied-blocks",
      JSON.stringify({
        blocks: dataToCopy,
        components: [],
      })
    );
    event.preventDefault();
  };
  document.addEventListener("copy", copyToClipboard);
</script>
